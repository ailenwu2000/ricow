[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# No self-updater (constitution principle 1 / 019 SC-011): the app never
# rewrites itself from the network; upgrades are an explicit user action.
install-updater = false
# Don't run the release workflow on pull requests: every PR was spending a full
# `dist plan` matrix just to re-derive what CI already validated, and the plan
# job needs repo-wide write-ish secrets context it has no business touching on
# an unreviewed branch. 这是**持久**开关 —— 手改 release.yml 会在下次
# `cargo dist init` 时被重新生成覆盖, 所以真相在这里。
pr-run-mode = "skip"
# Ship the launcher entries (019 FR-039 / T035) inside every archive (.tar.xz /
# .zip) so they sit next to the binary: 启动-ricow-AI助手.cmd on Windows,
# 启动-ricow-AI助手.sh on Linux/macOS, and 启动-ricow-AI助手.command for the macOS
# double-click (Finder runs .command files; the shim just execs the .sh).
# 025 FR-033 adds the Web UI twins of the same three files (启动-ricow-Web.*):
# same lookup logic, launch line "ricow web".
# They are **not** in the msi payload: the msi installs ricow.exe only (see
# crates/ricow/wix/main.wxs and README "Windows — msi"). Paths are relative to
# this file; no glob support.
include = [
    "packaging/启动-ricow-AI助手.cmd",
    "packaging/启动-ricow-AI助手.sh",
    "packaging/启动-ricow-AI助手.command",
    "packaging/启动-ricow-Web.cmd",
    "packaging/启动-ricow-Web.sh",
    "packaging/启动-ricow-Web.command",
]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
