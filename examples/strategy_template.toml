# ricow 用户策略模板
#
# 用法: 复制本文件到 <项目根>/strategies/<name>.toml 并修改; 脚本放
#   strategies/scripts/<name>.lua (相对路径以 strategies/ 为基准, 也可用绝对路径)。
# 运行: 在项目根执行 `ricow backtest --strategy <name>` 回测, `ricow run <name>` 实盘/Dry Run。
# 提示: strategies/ 目录被 git 忽略 (用户策略默认私有); 模板与示例见 examples/ 与 doc/lua-api.md。

[strategy]
name = "my_strategy"
type = "lua"
enabled = true
exchange = "binance"

[strategy.params]
pair = "ETH"
script_path = "scripts/my_strategy.lua"
