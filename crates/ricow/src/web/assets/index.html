<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      token 的**页面内载体**(043): 顶部导航带 `?token=` 时, 中间件会 303 到去掉 token 的路径
      (安全-11: 地址栏/历史不留 token), 此后 `location.search` 里就没有 token 了 —— 而
      `EventSource` / WebSocket 无法自定义请求头, 只能把 token 挂在 URL 上, 于是前端必须**另有一处**
      能读到它。服务端在 `/` 处把本占位符替换成**本次请求实际生效的 token**(与各资源 URL 同源,
      内嵌与 `--web-assets-dir` 两形态都替换), 故不引入任何新的暴露面。
      不用内联 `<script>` 是因为 CSP 为 `script-src 'self'`(无 `unsafe-inline`), 会被直接拦掉。
    -->
    <meta name="ricow-token" content="__RICOW_TOKEN__" />
    <title>Ricow</title>
    <!--
      静态资源的 URL 里带 `__RICOW_TOKEN__`: 服务端只在 `/` 处替换它(见 `web/mod.rs`)。
      浏览器取 `<link>` / `<script>` 无法自定请求头, 只能把 token 挂在查询串上 —— 与
      `EventSource` 走同一条取值路径(`token_of`)。
    -->
    <link rel="stylesheet" href="/style.css?token=__RICOW_TOKEN__" />
  </head>
  <body>
    <div id="app">
      <!-- 左: 主导航 + 竖长会话列表 (032 导航 / FR-006 / FR-007) -->
      <aside id="sidebar">
        <div class="side-head">
          <span class="brand">Ricow</span>
          <button id="new-session" class="icon-btn" type="button" data-zh="+ 新建" data-en="+ New">
            + 新建
          </button>
        </div>
        <!-- 033: hex 导航增为六项(对话/市场/策略/运行/密钥/设置); 高亮由 router.js 同步。 -->
        <nav id="nav">
          <a href="#chat" data-zh="对话" data-en="Chat">对话</a>
          <a href="#markets" data-zh="市场" data-en="Markets">市场</a>
          <a href="#strategies" data-zh="策略" data-en="Strategies">策略</a>
          <a href="#runs" data-zh="运行" data-en="Runs">运行</a>
          <a href="#keys" data-zh="密钥" data-en="Keys">密钥</a>
          <a href="#settings" data-zh="设置" data-en="Settings">设置</a>
        </nav>
        <!-- 会话列表始终显示(切到别的视图也保留在左栏)。 -->
        <ul id="session-list"></ul>
      </aside>

      <main id="main">
        <!-- 全视图共享的顶栏: 语言切换钮在任何视图都可见可用(FR-029)。 -->
        <header id="topbar">
          <span id="session-title" class="muted"></span>
          <span id="status" class="status"></span>
          <!-- 034: 主题切换, 值存 ricow.toml 的 [ui].theme(与语言同一来源)。 -->
          <select id="theme-select" class="mini-select" title="主题 / Theme">
            <option value="dark" data-zh="深色" data-en="Dark">深色</option>
            <option value="light" data-zh="白色" data-en="Light">白色</option>
            <option value="red" data-zh="红色" data-en="Red">红色</option>
          </select>
          <button id="lang-toggle" class="ghost-btn" type="button" title="中 / EN">EN</button>
        </header>

        <!-- 032: 视图容器, 同一时间只有一个 .view.active(router.js 切换)。 -->

        <!-- 对话视图: 中栏(对话流 + 输入区)与右栏三面板整体迁入, DOM 结构与 id 不变。 -->
        <section id="view-chat" class="view active">
          <div class="chat-col">
            <!-- 右上: 对话流 (用户与 AI 输出; 按级别着色 FR-013 / FR-023) -->
            <section id="stream" aria-live="polite"></section>

            <!-- 右下: 输入区 (FR-009 / FR-010) -->
            <form id="composer" autocomplete="off">
              <div
                class="hint"
                data-zh="Enter 发送 · Shift+Enter 换行"
                data-en="Enter to send · Shift+Enter for newline"
              >
                Enter 发送 · Shift+Enter 换行
              </div>
              <div class="composer-row">
                <textarea
                  id="input"
                  rows="1"
                  spellcheck="false"
                  data-zh-placeholder="说点什么…(也可以用 /help /history /lang /keys 这类命令)"
                  data-en-placeholder="Say something… (slash commands like /help /history /lang /keys work too)"
                ></textarea>
                <button id="send" type="submit" data-zh="发送" data-en="Send">发送</button>
              </div>
            </form>
          </div>

          <!--
            右: 交易面板 + 日志面板 (026 FR-012 / FR-016)。两块都**只读** —— 页面上没有任何直连交易所的
            按钮; 撤单 / 平仓 / 停机仍然只能走上面的对话确认流程(D17 / FR-013)。
          -->
          <aside id="panels">
            <section class="panel" id="strategy-panel">
              <div class="panel-head">
                <span data-zh="策略" data-en="Strategies">策略</span>
              </div>
              <!-- 031: 策略目录(内置示例 + 用户自写), 按现货/合约分组; 只读, 配置走对话确认。 -->
              <div id="strategy-list" class="rows"></div>
              <div id="strategy-detail" class="strategy-detail" hidden></div>
            </section>

            <section class="panel" id="trade-panel">
              <div class="panel-head">
                <span data-zh="交易" data-en="Trades">交易</span>
                <span id="trade-asof" class="muted small"></span>
              </div>
              <!-- 三态如实呈现(FR-014): "确实没有" / "daemon 未运行, 此刻状态不可知" / "读不到(原因)"。 -->
              <div id="trade-source" class="source"></div>
              <div class="block">
                <div class="block-title" data-zh="当前持仓" data-en="Positions">当前持仓</div>
                <div id="positions" class="rows"></div>
              </div>
              <div class="block">
                <div class="block-title" data-zh="挂单" data-en="Open orders">挂单</div>
                <div id="orders" class="rows"></div>
              </div>
              <div class="block">
                <div class="block-title" data-zh="最近成交" data-en="Recent fills">最近成交</div>
                <div id="fills" class="rows"></div>
              </div>
            </section>

            <section class="panel" id="log-panel">
              <div class="panel-head">
                <span data-zh="策略日志" data-en="Strategy log">策略日志</span>
                <select id="log-name" class="mini-select"></select>
              </div>
              <!--
                044: 日志工具条 —— 搜索 / 级别 / 跟随开关 + 诚实计数。
                三点口径写在这里, 免得以后被"优化"掉:
                  ① 日志行是文件里的**原样文本**(FR-018: 不解析、不着色), 故"级别"只能是行内
                     关键字**启发式**; 控件 title 与文案都自陈这一点, 不假装是精确分级。
                  ② 一个日志文件都没有时三个控件全 disabled(别给假控件)。
                  ③ 面板仍是**只读**的: 这里没有、也不许有直连交易所的动作按钮(D17),
                     一律禁用内联事件(见 assets.rs 的白名单断言)。
              -->
              <div class="log-tools">
                <input
                  id="log-search"
                  class="mini-input"
                  type="search"
                  autocomplete="off"
                  spellcheck="false"
                  disabled
                  placeholder="搜索日志…"
                  data-zh-placeholder="搜索日志…"
                  data-en-placeholder="Search log…"
                />
                <select id="log-level" class="mini-select" disabled>
                  <option value="all" data-zh="全部级别" data-en="All levels">全部级别</option>
                  <option value="error" data-zh="错误" data-en="Errors">错误</option>
                  <option value="warn" data-zh="警告" data-en="Warnings">警告</option>
                </select>
                <button id="log-follow" class="mini-btn" type="button" disabled data-zh="跟随中" data-en="Following">
                  跟随中
                </button>
                <span id="log-count" class="muted small"></span>
              </div>
              <div id="log-lines" class="log-lines"></div>
            </section>
          </aside>
        </section>

        <!-- 032 阶段 1: 其余四个视图只有占位, 业务逻辑后续阶段接入。 -->
        <section id="view-markets" class="view" hidden>
          <h2 class="placeholder-title" data-zh="市场" data-en="Markets">市场</h2>
        </section>
        <!-- 策略管理(032 US3): 容器由 strategies.js 渲染(列表/详情/弹窗全部 JS 生成)。 -->
        <section id="view-strategies" class="view" hidden></section>
        <!-- 运行管理(032 US4): 容器由 runs.js 渲染(实例表/弹窗/日志面板全部 JS 生成)。 -->
        <section id="view-runs" class="view" hidden></section>
        <!-- 密钥环(033): 容器由 keys.js 渲染(条目列表/详情表单/生效摘要全部 JS 生成)。 -->
        <section id="view-keys" class="view" hidden></section>
        <section id="view-settings" class="view" hidden>
          <h2 class="placeholder-title" data-zh="设置" data-en="Settings">设置</h2>
        </section>
      </main>
    </div>
    <!-- 032: 脚本按依赖顺序加载, 全部走 token 查询串鉴权; common.js 必须先于视图文件。 -->
    <script src="/lightweight-charts.js?token=__RICOW_TOKEN__"></script>
    <script src="/common.js?token=__RICOW_TOKEN__"></script>
    <script src="/router.js?token=__RICOW_TOKEN__"></script>
    <!-- 044: 受限 markdown 渲染器 —— chat.js 在 renderRich 里用它(助手气泡), 故须先加载。 -->
    <script src="/markdown.js?token=__RICOW_TOKEN__"></script>
    <script src="/chat.js?token=__RICOW_TOKEN__"></script>
    <script src="/settings.js?token=__RICOW_TOKEN__"></script>
    <script src="/keys.js?token=__RICOW_TOKEN__"></script>
    <script src="/markets.js?token=__RICOW_TOKEN__"></script>
    <script src="/strategies.js?token=__RICOW_TOKEN__"></script>
    <!-- 042: 策略视图拆出的三份子文件 —— **必须紧跟 strategies.js**(外壳先建立 `R.sg`,
         子文件在加载期从它取工具/常量; 顺序反了会整片 `undefined`)。 -->
    <script src="/strategy_form.js?token=__RICOW_TOKEN__"></script>
    <script src="/strategy_editor.js?token=__RICOW_TOKEN__"></script>
    <script src="/strategy_backtest.js?token=__RICOW_TOKEN__"></script>
    <script src="/runs.js?token=__RICOW_TOKEN__"></script>
    <script src="/app.js?token=__RICOW_TOKEN__"></script>
  </body>
</html>
