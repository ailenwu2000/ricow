[package]
name = "ricow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[package.metadata.wix]
upgrade-guid = "9EAEC2D1-DAAE-428F-A936-FA88C837A30D"
path-guid = "15AB41BC-15B9-4C8B-AF87-E8487C222BE0"
license = false
eula = false

[[bin]]
name = "ricow"
path = "src/main.rs"

[dependencies]
ricow_core.workspace = true
ricow_engine.workspace = true
ricow_binance.workspace = true
ricow_strategy.workspace = true
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
tracing.workspace = true
uuid.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
futures.workspace = true
rig.workspace = true
rustls.workspace = true
# 025: Web UI 服务端骨架
axum.workspace = true
# 019: 向导/`/keys` 静默录入密钥 (Win=winapi Console, Unix=termios); 纯 Rust 无异步依赖
rpassword = "7"
# 035: 回测 run card 的策略源码指纹 (SHA-256)
sha2 = "0.10"
# 低危#1: 密钥材料离开作用域时擦除内存 (见 `commands/config_file.rs` 的 Secret 包装)
zeroize.workspace = true

[dev-dependencies]
rust_decimal_macros = "1"

[lints]
workspace = true
