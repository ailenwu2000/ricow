# 合约中性香农网格 策略清单
#
# 清单是表现层数据(参数键不进引擎代码); 引擎/CLI/绑定层零策略参数名 ——
# 本文件 [[params]] 的 key 不得与引擎按名读取的参数同名(leverage/mmr_pct 等),
# 杠杆走清单顶层 default_leverage 字段, 由 resolve_builtin_script 回填 [backtest].leverage。

id = "shannon_neutral_grid_futures"
name = "合约中性香农网格"
name_en = "Neutral Shannon Grid (Futures)"
market = "futures"
position_mode = "one-way"
default_leverage = 3
summary = "USDT-M 合约单向持仓(可多可空)中性香农网格: 启动不建仓, 虚拟账本自 start_price 起 1:1 平衡(总资金=投入×杠杆, 虚拟仓位=总资金一半), 真实净仓围绕 0 双向摆动; 平衡价 − 买间距 / + 卖间距挂双向网格单(基础间距 = atr_mult×ATR 与下限取大); 方向 flag 驱动趋势侧间距指数放大(flag_spacing_mult, 默认 1.2), 回调间距不变; 全仓清算"
summary_en = "USDT-M one-way (long or short) neutral Shannon grid: starts flat, the virtual ledger balances 1:1 from the start price (total capital = invested x leverage, virtual position = half of it) while the real net position swings around zero; buy limits hang below and sell limits above the balance price (base spacing = the larger of the ATR-based spacing and a floor); a direction flag exponentially widens the trend-side spacing (default 1.2) while counter-trend spacing stays unchanged; cross liquidation"
description = """合约版中性香农网格(one-way 单向持仓, 可多可空): 杠杆 1~5 倍(默认 3),
总资金 = 投入资金 × 杠杆。启动不建仓: 以 start_price 为初始平衡价, 虚拟账本(虚拟现金 = 总资金一半,
虚拟仓位 Q0 = 总资金/(2×start_price))即 1:1 价值平衡, 真实仓位为 0; 真实净仓 = 虚拟持仓 − Q0,
围绕 0 双向摆动 —— 策略目标是实际仓位尽量保持 0(或随网格收割缓慢增长), 双向收割波动。
平衡价 − 买间距挂买单、平衡价 + 卖间距挂卖单(基础间距 = max(atr_mult×ATR, 最小间距下限×价格)),
每笔挂单量按"成交后虚拟现金与虚拟仓位价值恰好恢复 1:1"(含手续费修正)计算; 任一成交后成交价成为
新平衡价格并全撤重挂两侧。卖单为普通 one-way 限价单(不带 position_side/reduce_only)——
空仓卖出即开空, 是设计意图。
方向 flag 间距放大(flag_spacing_mult, 默认 1.2): flag = 网格卖笔数 − 买笔数(强平与期末清仓不计);
|flag|≥2 时趋势侧间距 × 系数^(|flag|−1) —— flag<0(净买、价格下探)放大买单间距,
flag>0(净卖、价格上冲)放大卖单间距, 另一侧(回调侧)不变; 1.0 = 禁用放大。语义: 单边趋势下趋势方向
成交自动变稀, 回调方向收割间距不变、更容易回调, 回调成交即 flag 回退、放大自动收缩。
漂移纠偏双侧对称: 跳空成交使账本漂移、任一侧挂单量出负时, 平衡价重锚到 虚拟现金/虚拟仓位
(1:1 恒等式定义价), 防止单侧挂单消失导致死锁。
爆仓价实时监控(任一方向仓距爆仓价 < 阈值告警, 只提示不动作), 运行期记录距爆仓最近的
时刻(stat_liq_dist_min/ts/price); 真发生爆仓(引擎 LIQ- 强平成交)即停机不再交易, 损失单列 stat_liq_pnl。
ATR 周期与 K 线周期可配(默认 1h K 线、14 周期、乘数 1.5), 间距随行情波动动态伸缩。无结束语义(公式自平衡)。
统计导出 stat_flag/stat_flag_max/stat_flag_min/stat_eff_flag_spacing_mult/stat_net_pos_final/
stat_max_net_notional。
⚠ 合约有杠杆: 默认全仓(cross)清算 —— 净敞口远小于总名义, 多空方向盈亏互抵;
逐仓(--param margin_mode=isolated)两腿独立清算。请关注 stat_liq_dist_min 与 stat_max_net_notional。
注意: cross 下单侧爆仓价无定义(pos_liq 显示 "-", 策略侧告警通道自动静默), 引擎按组合权益判定强平。"""
description_en = """Futures neutral Shannon grid (one-way position, long or short): leverage 1-5x (default 3), total capital = invested capital x leverage. It starts flat: the start price is the initial balance price, and the virtual ledger (virtual cash = half the total capital, virtual position Q0 = total capital / (2 x start price)) is in 1:1 value balance while the real position is zero; real net position = virtual position - Q0, swinging around zero - the goal is to keep the actual position near zero (or let it grow slowly from grid harvesting), collecting volatility in both directions.
Buy limits hang below the balance price, sell limits above it (base spacing = the larger of the ATR-based spacing and a minimum floor), each order sized so that after a fill the virtual cash and position value return exactly to 1:1 (with a fee correction); any fill makes the trade price the new balance price and re-hangs both sides. Sell orders are plain one-way limits (no position side / reduce-only) - selling while flat opens a short, which is by design.
Direction-flag spacing widening (factor, default 1.2): the flag is net grid sells minus buys (liquidation and end-of-run close excluded); once its magnitude reaches 2 the trend-side spacing grows by factor^(|flag|-1) - net buying widens buy spacing, net selling widens sell spacing, the counter-trend side unchanged. In a one-way trend, trend-side fills thin out automatically while counter-trend spacing stays tight and easier to hit; a counter-trend fill rolls the flag back and the widening shrinks on its own.
Drift correction is symmetric: when a gap fill makes the ledger drift and one side's order size goes negative, the balance price re-anchors to virtual cash / virtual position (the 1:1 identity price), preventing a deadlock where one side's orders vanish.
Liquidation price is monitored in real time (a warning fires when either direction's distance to liquidation drops below a threshold; advisory only) and the closest-ever moment is recorded; a real liquidation (engine forced-close fill) halts trading, with the loss reported separately. ATR period and candle interval are configurable (default 1h candle, period 14, multiplier 1.5), so spacing flexes with volatility. There is no end condition (the formula self-balances).
Warning: leveraged trading. Default cross liquidation - net exposure is far below total notional and long/short PnL offset; isolated mode (switch via parameter) settles the two legs independently. Watch the liquidation-distance and max net-notional stats. Under cross a one-side liquidation price is undefined (shown as "-", its alert silenced); the engine judges forced closure by combined equity."""
suitable = "震荡市双向收割、期望实际仓位保持中性(≈0)的合约网格交易者; 单边趋势中希望趋势成交自动变稀、回调收割不变者"
unsuitable = "极低波动(间距低于成本门槛自动停机)、单边不回头的极端行情(净敞口持续累积)"

[[params]]
key = "pair"
name = "合约对"
name_en = "Contract Pair"
type = "string"
desc = "USDT-M 合约交易对(如 SOLUSDT)"
desc_en = "USDT-M perpetual pair (e.g. SOLUSDT)"
required = true
group = "基础配置"

[[params]]
key = "interval"
name = "主时钟"
name_en = "Primary Clock"
type = "string"
desc = "主时钟周期(回测建议 1m 数据提升撮合粒度)"
desc_en = "Main clock interval (1m recommended in backtests for finer matching)"
default = "1h"
group = "基础配置"

[[params]]
key = "invest_cash"
name = "投入资金"
name_en = "Invested Capital"
type = "f64"
desc = "投入资金(保证金, USDT); 总资金 = 投入 × 杠杆, 虚拟仓位 = 总资金/(2×start_price)。0 = 启动时 quote 余额全额"
desc_en = "Margin in USDT; total capital = invested x leverage, and the virtual position = total capital / (2 x start price). 0 = full quote balance at start"
default = 0
group = "基础配置"

[[params]]
key = "fee_side"
name = "单边费率"
name_en = "Fee per Side"
type = "f64"
desc = "单边手续费率(0.0005 = 合约 taker 0.05%/边)"
desc_en = "Commission rate per side (0.0005 = 0.05% taker per side)"
default = 0.0005
group = "基础配置"

[[params]]
key = "min_notional"
name = "单笔最小名义"
name_en = "Min Order Notional"
type = "f64"
desc = "单笔最小名义金额(合约 SOLUSDT fapi 最小名义 5)"
desc_en = "Minimum notional per order (the SOLUSDT futures floor is 5)"
default = 5
group = "基础配置"

[[params]]
key = "start_price"
name = "开始价格"
name_en = "Start Price"
type = "f64"
desc = "初始平衡价与虚拟仓位基准(必填; 回测请设为窗口起点价, 勿前视)"
desc_en = "Initial balance price and virtual-position basis (required; in backtests set it to the window's opening price, no lookahead)"
required = true
group = "激活"

[[params]]
key = "atr_interval"
name = "ATR K 线周期"
name_en = "ATR Candle Interval"
type = "string"
desc = "用哪根 K 线算 ATR(如 1h/4h/1d)"
desc_en = "Which candle interval ATR is computed on (e.g. 1h/4h/1d)"
default = "1h"
group = "网格间距"

[[params]]
key = "atr_period"
name = "ATR 周期"
name_en = "ATR Period"
type = "i64"
desc = "ATR 回看根数"
desc_en = "Number of candles ATR looks back over"
default = 14
group = "网格间距"

[[params]]
key = "atr_mult"
name = "ATR 乘数"
name_en = "ATR Multiplier"
type = "f64"
desc = "网格间距 = atr_mult × ATR"
desc_en = "Grid spacing scales with volatility (ATR)"
default = 1.5
group = "网格间距"

[[params]]
key = "min_spacing_pct"
name = "最小间距(价格占比)"
name_en = "Min Spacing (Price %)"
type = "f64"
desc = "间距下限(占价格比例, 0.002 = 0.2% = 4×合约费率; 负数 = 禁用下限); 生效间距 = max(atr_mult×ATR, 该下限×价格), 防 ATR 过窄被手续费磨损"
desc_en = "Spacing floor as a share of price (0.002 = 0.2%, about 4x the futures fee; negative disables it); guards against fee churn when volatility is too low"
default = 0.002
group = "网格间距"

[[params]]
key = "flag_spacing_mult"
name = "间距放大系数"
name_en = "Spacing Widening Factor"
type = "f64"
desc = "方向 flag 驱动的网格间距指数放大系数, 默认 1.2: flag = 网格卖笔数 − 买笔数(强平与期末清仓不计); |flag|≥2 时趋势侧间距 × 系数^(|flag|−1)(flag<0 净买→放大买单间距, flag>0 净卖→放大卖单间距, 回调侧不变), 买卖量随间距自动跟随保持 1:1; 1.0 = 禁用放大(<1 按 1 处理)"
desc_en = "Exponential widening of the trend-side grid spacing driven by a direction flag (default 1.2): the flag is net grid sells minus buys (liquidation and end-of-run close excluded); once its magnitude reaches 2 the trend-side spacing grows by factor^(|flag|-1) - net buying widens buy spacing, net selling widens sell spacing, the counter-trend side unchanged - while trade sizes follow automatically to keep 1:1; 1.0 disables it (below 1 treated as 1)"
default = 1.2
group = "网格间距"

[[params]]
key = "liq_warn_ratio"
name = "爆仓价告警阈值"
name_en = "Liquidation Warning Threshold"
type = "f64"
desc = "小数(0.1=10%); 任一方向仓距爆仓价 < 该比例打 WARN(只告警不动作)。与引擎 014 的 liq_warn_pct(百分点)是两条通道"
desc_en = "Fraction (0.1 = 10%); warns when either direction's distance to its liquidation price drops below it (advisory only). A separate channel from the engine-level liquidation warning"
default = 0.1
group = "爆仓监控"

[backtest]
# 全仓(cross): 投入资金整体作为该 pair 的清算缓冲; 单向持仓可多可空, 净敞口 = |多−空| 通常远小于
# 总名义, 组合权益扛清算(对齐币安全仓语义)。逐仓(isolated, CLI --param margin_mode=isolated)
# 两腿独立清算, 完全中性也可能单腿爆仓。
margin_mode = "cross"
