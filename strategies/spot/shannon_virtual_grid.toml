# 策略清单(manifest): 展示元数据 + 参数 schema。仅供 UI/CLI/AI, 引擎不读(架构铁律)。
id = "shannon_virtual_grid"
name = "现货虚拟香农网格"
market = "spot"
summary = "EMA 金叉/死叉作为交易闸门的虚拟账本香农网格: 总资金=投入×虚拟倍数(默认2), 虚拟现金与虚拟仓位恒 1:1; 交叉且价格偏离平衡价≥一个间距时按 1:1 恢复量下市价单再平衡(不挂限价单); 间距=max(atr_mult×ATR, 0.4%×价格), 趋势侧间距按方向 flag 指数放大; 死叉卖量超实际持仓则按初始投入×倍数在当前价重置 1:1 虚拟仓位"
description = """
虚拟账本版香农网格(现货): 与现货 shannon_grid 的真实账本不同, 本策略以虚拟账本(虚拟现金 v_cash + 虚拟仓位 v_pos)
恒 1:1 价值平衡驱动再平衡量, 虚拟总资金 = 投入资金 × 虚拟倍数(1~5, 默认 2)。投入 1 万、倍数 2, 虚拟仓位即按
2 万的 1:1 建立。

交易闸门 = EMA 金叉/死叉(默认 1m K 线、快线 2、慢线 3, 均可配): 金叉表示趋势转多、死叉表示趋势转空。
交易方式 = 市价单, 平时盘口不挂任何限价单:
  · 金叉且(平衡价 − 当前价) ≥ 买间距 → 按虚拟账本 1:1 恢复量市价买入回补;
  · 死叉且(当前价 − 平衡价) ≥ 卖间距 → 按虚拟账本 1:1 恢复量市价卖出减仓;
  · 未交叉或漂移不足一个间距 → 不动作。回测中市价单按开盘价 ± 滑点成交, 等价"金叉用市场卖价买入、
    死叉用市场买价卖出"。
任一成交后成交价成为新平衡价; 虚拟账本按目标量推进(恒满足 v_cash = v_pos × 平衡价), 真实账本按实际成交
推进并与引擎交叉核对。

网格间距 = max(atr_mult × ATR, min_spacing_pct × 价格): 默认 1m K 线 14 周期 ATR × 5, 最小间距 0.4%
(防 ATR 过窄被手续费磨损; 负数禁用下限)。ATR 的 K 线周期与乘数均可配。
方向 flag 间距指数放大(同合约香农网格): flag = 网格卖笔数 − 买笔数(建仓/重置不计);
|flag|≥2 时趋势侧间距 × flag_spacing_mult^(|flag|−1)(默认 1.2) —— flag<0(净买)放大买间距、
flag>0(净卖)放大卖间距, 另一侧不变; 1.0 = 禁用。单边趋势中趋势方向成交自动变稀, 回调收割不变。

卖出仓位不足 → 重置虚拟仓位: 死叉算出的卖量超过实际持仓时, 不部分卖出, 而是按初始投入资金 × 虚拟倍数
在当前价格重建 1:1 虚拟仓位(v_pos = v_total/(2×当前价), v_cash = v_total/2), 新平衡价 = 当前价,
本次不发单。重置次数导出 stat_reset_count。

建仓开关(enable_build, 默认关): 打开后等待价格低于 build_price, 市价买入 build_amount USDT 建立实际仓位,
成交价 = 第一平衡价格, 建仓完成后策略正式开始; 关闭时首次金叉只做虚拟初始化 —— 当前价 + 一个网格间距作为
初始平衡价, 在平衡价按总资金 1:1 建立虚拟仓位, **不下任何实际订单**(真实现金全额保留, 首次真实买入发生在
价格跌破平衡价一个间距的金叉时刻)。回测默认不建仓。

⚠ 现货无真实杠杆: virtual_mult > 1 只放大虚拟账本的再平衡量, 实际买入受可用现金截断(虚拟目标量 >
现金时实发只到现金上限, 计入 stat_cash_limited_buys), 有效杠杆随交易自然回落。单边暴跌会套牢 ——
建议用认沽期权/做空合约对冲尾部风险。
"""
suitable = "震荡市(双向再平衡收割)、宽幅波动; 希望用 EMA 趋势拐点过滤逆势再平衡、避免单边下跌接飞刀的网格交易者"
unsuitable = "单边急跌(现货多头套牢, 建议期权对冲)、极低波动(间距低于成本门槛自动停机)、EMA 频繁假交叉的高噪行情(靠间距带过滤, 但快慢线过密仍会频繁触发)"

[[params]]
key = "pair"
name = "交易对"
type = "string"
desc = "现货交易对(如 SOLUSDT)"
required = true

[[params]]
key = "invest_cash"
name = "投入资金"
type = "f64"
desc = "投入资金(计价币); 总资金 = 投入 × 虚拟倍数。0 = 启动时 quote 余额全额"
default = 0

[[params]]
key = "virtual_mult"
name = "虚拟倍数"
type = "f64"
desc = "虚拟仓位规模倍数, 默认 2, 合法 1~5(越界停机)。投入 1 万 × 倍数 2 → 虚拟仓位按 2 万的 1:1 建立。现货无真实杠杆, mult>1 放大再平衡量, 买量超出可用现金时按现金截断实发"
default = 2

[[params]]
key = "enable_build"
name = "建仓开关"
type = "bool"
desc = "默认 false。打开后等待价格低于 build_price 市价买入 build_amount 建立实际仓位, 成交后策略正式开始; 关闭时首次金叉只做虚拟初始化(平衡价=现价+间距, 1:1 虚拟仓位), 不下任何实际订单"
default = false

[[params]]
key = "build_price"
name = "建仓触发价"
type = "f64"
desc = "价格低于它才市价建仓(enable_build=true 时必填)"
default = 0

[[params]]
key = "build_amount"
name = "建仓金额(USDT)"
type = "f64"
desc = "建仓买入金额 USDT(enable_build=true 时必填)"
default = 0

[[params]]
key = "interval"
name = "主时钟"
type = "string"
desc = "主时钟周期(默认 1m, 与 EMA/ATR 评估频率一致)"
default = "1m"

[[params]]
key = "ema_interval"
name = "EMA K 线周期"
type = "string"
desc = "金叉/死叉所用 EMA 的 K 线周期(默认 1m)"
default = "1m"

[[params]]
key = "ema_fast"
name = "EMA 快线周期"
type = "i64"
desc = "快线周期, 默认 2(快慢线过近会频繁交叉, 靠间距带过滤; 趋势型可改 9 或更高周期)"
default = 2

[[params]]
key = "ema_slow"
name = "EMA 慢线周期"
type = "i64"
desc = "慢线周期, 默认 3(趋势型可改 21 或更高周期)"
default = 3

[[params]]
key = "atr_interval"
name = "ATR K 线周期"
type = "string"
desc = "用哪根 K 线算 ATR(默认 1m, 可配 1h/4h/1d)"
default = "1m"

[[params]]
key = "atr_period"
name = "ATR 周期"
type = "i64"
desc = "ATR 回看根数"
default = 14

[[params]]
key = "atr_mult"
name = "ATR 乘数"
type = "f64"
desc = "网格间距 = atr_mult × ATR, 默认 5"
default = 5

[[params]]
key = "min_spacing_pct"
name = "最小间距(价格占比)"
type = "f64"
desc = "间距下限(占价格比例, 0.004 = 0.4%); 生效间距 = max(atr_mult×ATR, 该下限×价格), 防 ATR 过窄被手续费磨损; 负数 = 禁用下限"
default = 0.004

[[params]]
key = "flag_spacing_mult"
name = "间距放大系数"
type = "f64"
desc = "方向 flag 驱动的网格间距指数放大系数, 默认 1.2: flag = 网格卖笔数 − 买笔数(建仓/种子/重置不计); |flag|≥2 时趋势侧间距 × 系数^(|flag|−1)(flag<0 净买→放大买单间距, flag>0 净卖→放大卖单间距, 另一侧不变); 1.0 = 禁用放大(<1 按 1 处理)"
default = 1.2

[[params]]
key = "min_notional"
name = "单笔最小名义"
type = "f64"
desc = "单笔最小名义金额"
default = 5

[[params]]
key = "fee_side"
name = "单边费率"
type = "f64"
desc = "单边手续费率(0.001 = 现货 0.1%/边)"
default = 0.001
