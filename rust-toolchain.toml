# 工具链版本**钉死**(2026-09-15): CI 与本地必须同一版本, 否则 clippy 门禁会因 upstream 发版而随机变红
# (实测教训: 本地 stable=1.96.1 时 CI 的 stable 已是 1.98.1, 同一份代码在 CI 上出现新告警)。
#
# 升级流程(单独立项, 不要顺手改):
#   1) 本地 `rustup toolchain install <新版本> --component clippy,rustfmt`
#   2) 改本文件 channel + 同步 README/CONTRIBUTING 里的 MSRV 说明
#   3) 跑 `cargo clippy --workspace --all-targets --locked -- -D warnings` 清掉新告警
#   4) 一并提交, 观察 CI
[toolchain]
channel = "1.96.1"
components = ["rustfmt", "clippy", "rust-docs"]
