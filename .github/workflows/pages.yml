# 官网(ricow.xyz)部署: 纯静态站点, 源 = 仓库 website/ 目录
# 只在 website/ 或本文件变化时触发(不干扰 Rust CI); 首次运行会自动启用 Pages
name: Pages

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: deploy website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: 配置 Pages(未启用时自动启用)
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: 打包站点目录
        uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
