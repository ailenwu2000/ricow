# 官网(ricow.xyz)部署: 纯静态站点, 源 = 仓库 website/ 目录
# 只在 website/ 或本文件变化时触发(不干扰 Rust CI)
# 前置(仓库管理员做一次): Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
name: Pages

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: deploy website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # 不能用 enablement: true 自动启用 —— 官方 action.yml 要求该选项必须提供非 GITHUB_TOKEN 的凭据
      # (PAT 需 repo scope 或 Pages write; GitHub App 需 administration:write + pages:write)。
      - name: 配置 Pages
        uses: actions/configure-pages@v6
      - name: 打包站点目录
        uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
