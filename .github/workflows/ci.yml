name: CI

on:
  # 所有分支推送都跑(项目组成员会把分支推到本仓库, 需要分支级反馈)
  push:
    branches: ["**"] # 任意分支推送都跑(分支级反馈); tag 走 release.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # 结构性红线 (写操作不得绕过确认门 / 密钥不得进日志 …)。零依赖、秒级完成, 放最前面先给反馈。
  gates:
    name: gates (安全 / 架构红线)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 单测覆盖"行为", 本门禁覆盖"形状" —— 违反这些红线的代码功能照常, 单测不会红。
      - name: 安全 / 架构红线
        run: bash scripts/ci_grep_gates.sh

  lint:
    name: lint (clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 工具链版本唯一来源 = rust-toolchain.toml(钉死版本, 避免 stable 浮动导致门禁随机变红)
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        # 全仓已于 022 对齐(2026-09-15); 格式门禁自此为硬失败
        run: cargo fmt --all -- --check
      - name: clippy
        # 存量告警已于 021 清零(2026-09-15); 门禁为硬失败, 新告警一律挡住
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # 依赖合规: 许可证白名单 + 已知漏洞 + 来源(只认 crates.io)。配置见仓库根 deny.toml。
  deny:
    name: deny (依赖许可证 / 漏洞 / 来源)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS 是**已发布**的平台(见 dist-workspace.toml targets), 发布了就必须有测试背书,
        # 否则 arm64/x64 上的路径分隔/临时目录/信号语义差异只能等用户来报。
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      # 需要真实外部环境/密钥的用例标了 #[ignore], CI 不跑(见 CONTRIBUTING 第二节)
      - run: cargo test --workspace --locked
