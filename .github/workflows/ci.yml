name: CI

on:
  # 所有分支推送都跑(项目组成员会把分支推到本仓库, 需要分支级反馈)
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: lint (clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 工具链版本唯一来源 = rust-toolchain.toml(钉死版本, 避免 stable 浮动导致门禁随机变红)
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        # 全仓已于 022 对齐(2026-09-15); 格式门禁自此为硬失败
        run: cargo fmt --all -- --check
      - name: clippy
        # 存量告警已于 021 清零(2026-09-15); 门禁为硬失败, 新告警一律挡住
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      # 需要真实外部环境/密钥的用例标了 #[ignore], CI 不跑(见 CONTRIBUTING 第二节)
      - run: cargo test --workspace --locked
