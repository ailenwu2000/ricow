[workspace]
resolver = "2"
members = [
    "crates/ricow_core",
    "crates/ricow_binance",
    "crates/ricow_strategy",
    "crates/ricow_engine",
    "crates/ricow",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
description = "ricow —— 完全本地运行的量化策略引擎(回测 / Dry Run / 实盘), 策略用 Lua 编写, 纯本地 CLI"
repository = "https://github.com/ailenwu2000/ricow"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
# rustls 运行时需要在多个 crypto provider 并存时**显式**装一个(见 crates/ricow/src/main.rs)
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-str"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "rust_decimal"] }
mlua = { version = "0.11", features = ["lua54", "send", "vendored"] }
ta = "0.5"
# 019: AI 助手 LLM 编排 (工具循环 / 审批门 / 流式 / 多供应商)。0.42 线锁定; 走 OpenAI 兼容通道
rig = "0.42"

[workspace.lints.rust]
unsafe_code = "forbid"
