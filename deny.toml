# deny.toml —— 依赖合规门禁 (cargo-deny)
#
# 为什么需要它: ricow 要开源发布, 依赖树里的**许可证不兼容 / 已知漏洞 / 可疑来源**必须由机器在
# CI 上拦下 —— 靠人肉 review `Cargo.lock` 不现实, 而这类问题一旦进了 release 就只能回收版本。
#
# 本地校验: cargo deny check
# CI:       .github/workflows/ci.yml 的 `deny` job
#
# 目标: 与 dist-workspace.toml 的发布矩阵**逐一对齐**, 只审我们真正发货的平台依赖。

[graph]
# 与 dist-workspace.toml `[dist] targets` 同源; 改一处必须改另一处。
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
# yank 先只告警: RustSec 会随生态变化频繁改判, 直接 deny 会让门禁在某天因为**与我们无关**的
# 上游变动突然变红 —— 那种噪声最终会让人开始无视门禁。已知漏洞仍是硬失败 (v2 默认)。
yanked = "warn"
# unmaintained / unsound 只审**我们自己直接依赖**的 crate (transitive 里历史包袱太多,
# 全开会长期红着, 门禁就失去信号价值)。
unmaintained = "workspace"
unsound = "workspace"
# 需要放行时**逐条**列在这里 + 写明理由与到期时间, 不允许留空白兜底。
ignore = []

[licenses]
version = 2
# 允许名单 = 本仓库依赖树实测出现过的全部许可证 (由 `cargo metadata` 统计得出, 非拍脑袋)。
# 全部为宽松许可 (MIT/Apache/BSD/ISC/Zlib/Unicode/CC0/Boost/NCSA/MPL-2.0)。
# 新增依赖若引入名单外许可证, CI 会红 —— 那时再逐条评估, 而不是先把名单放大。
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# 重复版本只告警: 传递依赖里同一 crate 多版本是生态常态, deny 会让门禁长期红着。
multiple-versions = "warn"
# 通配版本 (`*`) 一律拒绝: 通配版本不可复现, 而且将来若某个内部 crate 被误发布,
# 下游会静默解析到 crates.io 上的任意版本。内部依赖的 path + version 统一声明在
# 仓库根 Cargo.toml 的 `[workspace.dependencies]` (成员里写 `xxx.workspace = true`)。
wildcards = "deny"
# 明确禁止的 crate 放这里 (例: 已知有安全问题的解析库)。
deny = []

[sources]
# 只接受 crates.io。未知 registry / git 源 = 不可复现 + 无审计, 必须显式批准后才放行。
unknown-registry = "deny"
unknown-git = "deny"
